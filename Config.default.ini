; NC-TK17-PhysX global configuration
; Lines starting with ; are comments. The plugin reloads this file while the game is running.
; Add-on body overrides: place body01.physx.ini/body02.physx.ini/body03.physx.ini next to the matching bodyXX.bs.
; Body sidecars may reuse [penis_physics], [testicle_physics], and [body_colliders]; omitted keys fall back here.

; stiffness: float - Global fallback spring strength for sidecar/add-on physics.
; damping: float - Global fallback damping for sidecar/add-on physics.
; gravity: vector3 - Global fallback gravity direction.
; limit_angle: float - Global fallback angle limit for sidecar/add-on physics.
; debug: boolean - Enables verbose reverse-engineering logs. Keep false for normal gameplay/performance.
; performance_profile: boolean - Logs one compact performance summary per second without enabling debug probes. Use temporarily for benchmarking.
; config_reload_poll_ms: integer - How often the main INI and active body sidecars are checked for edits. Minimum is 100 ms.
[defaults]
stiffness = 0.65
damping = 0.25
gravity = 0,-1,0
limit_angle = 35
debug = false
performance_profile = false
config_reload_poll_ms = 250

; enabled: master switch for regular add-on sidecars such as Hair/Cloth/Object .physx.ini files.
; Body sidecars and built-in penis/testicle PhysX are unaffected.
; binding_probe: read-only diagnostics for regular add-on sidecars. It logs live candidate objects but performs no physics writes.
; sidecar_hot_reload: checks already-active add-on sidecar INI timestamps while in-room. Does not rescan the whole Addons tree.
; sidecar_hot_reload_interval_ms: time between active-sidecar timestamp checks.
; sidecar_hot_reload_max_checks_per_tick: max active sidecars checked per interval; larger values reload faster but do more file stats at once.
[addon_physics]
enabled = true
binding_probe = false
sidecar_hot_reload = true
sidecar_hot_reload_interval_ms = 1000
sidecar_hot_reload_max_checks_per_tick = 8

; world_gravity_probe: boolean - Enables stable startup probing for world-gravity body-chain behavior.
; world_gravity: vector3 - World-space gravity direction. Y-down is the current TK17 world gravity.
; gravity_horizontal_source_vector: vector3 - Advanced/manual fallback horizontal gravity projection vector.
; gravity_vertical_source_vector: vector3 - Advanced/manual fallback vertical gravity projection vector.
; gravity_apply_to_body_chain: boolean - Applies world gravity to built-in body-chain physics.
; gravity_body_chain_scale: float - Compatibility fallback for an omitted horizontal/vertical body-chain scale; unused when both are explicitly set.
; gravity_horizontal_body_chain_scale: float - Horizontal gravity strength for the body chain.
; gravity_vertical_body_chain_scale: float - Vertical gravity strength for the body chain.
; gravity_horizontal_secondary_body_chain_scale: float - How much the third body-basis gravity channel bends horizontally.
; gravity_vertical_secondary_body_chain_scale: float - How much the third body-basis gravity channel bends vertically.
; gravity_horizontal_tail_axis: axis - Built-in chain axis receiving horizontal world-gravity bend.
; gravity_vertical_tail_axis: axis - Built-in chain axis receiving vertical world-gravity bend. Independent from rotation_*_tail_axis.
; body_chain_camera_relative_orientation: boolean - Learns camera-free root rotation from root * inverse(TRS_group), then keeps animated rotation driving the chain while camera-contaminated translation is blocked.
; body_chain_camera_coast_stiffness_scale: float 0-1 - Spring strength retained while camera-contaminated root input is quarantined. Lower values reduce visible freezing.
; body_chain_camera_coast_damping_scale: float 0-1 - Damping retained while camera-contaminated root input is quarantined. Lower values preserve chain velocity longer.
; body_chain_camera_quarantine_ms: integer - Root-drive quiet window after camera movement. Also raises the gravity quiet window if larger than its other minimums.
; gravity_dynamic_body_basis: boolean - Reads live body/root basis vectors so gravity stays world-relative.
; gravity_basis_camera_compensate: boolean - Converts world gravity into camera/view space before comparing it to view-space body basis rows.
; gravity_basis_node: string - Body node used as the dynamic gravity basis, usually root.
; gravity_horizontal_basis_offset: offset - Body-local lateral basis used for horizontal gravity bending.
; gravity_vertical_basis_offset: offset - Body-local forward/up-depth basis used for vertical gravity bending.
; gravity_horizontal_secondary_basis_offset: offset - Third body-local basis, measured independently but normally not routed into bend.
; gravity_horizontal_basis_sign: float - Sign/scale correction for lateral gravity projection.
; gravity_vertical_basis_sign: float - Sign/scale correction for forward gravity projection.
; gravity_horizontal_secondary_basis_sign: float - Sign/scale correction for the third basis projection.
; gravity_zero_at_start: boolean - When true, the first valid pose becomes neutral. Keep false for pose-independent world gravity.
; gravity_response_ms: float - Body gravity target smoothing time in milliseconds. 0 removes smoothing, but camera sample checks, the speed cap and physical springs still apply.
; gravity_max_degrees_per_second: float - Maximum speed of gravity-driven target rotation. 0 disables the limit.
; gravity_probe_settle_ms: integer - Startup root stability window before baseline capture; also used by collider/add-on startup checks.
; gravity_probe_confirm_ms: integer - Startup baseline confirmation time. Does not control the new consecutive-frame gravity sample check.
; gravity_probe_camera_quiet_ms: integer - Camera quiet window for startup/root-drive checks. Live gravity uses at least 48 ms, or this/root quarantine value if larger.
; gravity_probe_motion_epsilon: float - Root movement tolerance while waiting for a stable baseline.
; gravity_probe_invalidate_epsilon: float - Root movement threshold that invalidates an unready baseline.
; gravity_probe_require_nonzero_root: boolean - Waits for non-placeholder root data before baseline capture.
; gravity_probe_log_ms: integer - Gravity diagnostic log throttle. Detailed math logs require debug = true.
; After camera quiet, live gravity also requires agreeing samples on consecutive frames.
; Springs keep running with the last trusted direction while a new sample is checked.
[physics_environment]
world_gravity_probe = true
wind_enabled =true
world_gravity = 0,-1,0
gravity_horizontal_source_vector = 0,0,0
gravity_vertical_source_vector = 0,-1,0
gravity_apply_to_body_chain =true
gravity_body_chain_scale = 30.0
gravity_horizontal_body_chain_scale = 30.0
gravity_vertical_body_chain_scale = 30.0
gravity_horizontal_secondary_body_chain_scale = 0.0
gravity_vertical_secondary_body_chain_scale = 0.0
gravity_horizontal_tail_axis = z
gravity_vertical_tail_axis = y
body_chain_camera_relative_orientation = true
body_chain_camera_coast_stiffness_scale = 0.35
body_chain_camera_coast_damping_scale = 0.5
body_chain_camera_quarantine_ms = 0
gravity_dynamic_body_basis = true
gravity_basis_camera_compensate = true
gravity_basis_node = root
gravity_horizontal_basis_offset = 0x088
gravity_vertical_basis_offset = 0x098
gravity_horizontal_secondary_basis_offset = 0x078
gravity_horizontal_basis_sign = -1.0
gravity_vertical_basis_sign = -1.0
gravity_horizontal_secondary_basis_sign = 1.0
gravity_zero_at_start = false
gravity_response_ms = 100.0
gravity_max_degrees_per_second = 500.0
gravity_probe_settle_ms = 10
gravity_probe_confirm_ms = 0
gravity_probe_camera_quiet_ms = 10
gravity_probe_motion_epsilon = 0.005
gravity_probe_invalidate_epsilon = 0.005
gravity_probe_require_nonzero_root = true
gravity_probe_log_ms = 2000

; Normal user controls and motion tuning.
; enabled/person switches are also available on the in-game PhysX Settings tab.
; translation_*_scale: response to movement of the chain parent.
; rotation_*_scale: response to rotation of the chain parent.
; gravity_horizontal_curve/gravity_vertical_curve: directional world-gravity strength curves (0.1-8.0). 1.0 is the original response.
; Above 1.0 reduces gravity at partial body tilts; below 1.0 reacts earlier. Diagonal directions blend both values without changing gravity direction.
; stiffness: spring strength. damping: settling strength.
; jointXX_min_angle/jointXX_max_angle: X,Y,Z bend limits for each chain joint. A single value still applies to all axes.
; If a min angle is omitted, it defaults to the negative max angle for old symmetric behavior.
; jointXX_gain: how strongly each chain joint participates.
; interval_ms: simulation update interval. Minimum is 16 ms.

; --- collision_scope ---
; collision_scope limits which body collider groups this chain tests, select from the following options in order to achieve the best performance:
; Values ending in _all include every loaded person; the others include only the wearer.
; Available values: hands_only, hands_only_all, genitals_only, genitals_only_all, pelvis_and_genitals_only, pelvis_and_genitals_only_all,
; pelvis_genitals_hands_only, pelvis_genitals_hands_only_all, full_body, full_body_all.

; hands_only: wrists, palms, and all finger segments only.
; genitals_only: penis/testicle chains and genital hitboxes only.
; pelvis_and_genitals_only: genitals, spine01, and the left/right hip area.
; pelvis_genitals_hands_only: pelvis/genitals plus wrists, palms, and all finger segments.
; full_body: all available body and genital colliders.
; full_body_all preserves the original collision behavior and is the default.

; Breast PhysX targets only breast_scale_L_joint and breast_scale_R_joint.
; Both breasts share these settings and each runs as a single-bone spring.
; Child bones follow their breast parent and are not simulated separately.
; TK17's native left/right breast inertia is disabled and restored automatically.
; Optional bone translation includes movement-driven spring motion and an
; independent world-gravity sag offset.
[breasts_physics]
enabled =true
room_collision_enabled =true
enabled_person01 =true
enabled_person02 =true
enabled_person03 =true
enabled_person04 =true
collision_scope =full_body_all
; Translation-driven breast rotation
translation_horizontal_scale = 0.5
translation_vertical_scale = -0.5
translation_depth_scale = 0.05
; Translation-driven breast translation
bone_translation_enabled = true
bone_translation_space = body
bone_translation_horizontal_scale = -0.4
bone_translation_vertical_scale = -0.7
bone_translation_depth_scale = -0.2
bone_translation_gravity_sag = 0.025 ; Breasts sagging percentage wise. 0.0 = 0%, 0.05 = 5%, 0.5 = 50%, etc.
bone_translation_stiffness = 200.0
bone_translation_damping = 6.0 
bone_translation_max_offset = 0.03,0.03,0.03 ; Maximum local movement in scene units for X, Y, Z.
; Rotation-driven breast rotation
rotation_horizontal_scale = -2.0
rotation_vertical_scale = 2.0
rotation_twist_scale = 2.0
gravity_horizontal_curve = 1.0
gravity_vertical_curve = 1.0
; Gravity
gravity_strength = 10.0
gravity_inward_strength = 10.0 ; This controls how much the breasts are pulled inward when the torso is facing the ground.
gravity_outward_strength = 20.0 ; This controls how much the breasts are pushed outward when the torso is facing the sky.
; Wind
wind_enabled = true
wind_scale = 2.0
; Misc
stiffness = 150.0
damping = 5.0
joint01_max_angle = 30,30,30
joint01_min_angle = -30,-30,-30
joint01_gain = 1.0
interval_ms = 16

[penis_physics]
enabled =true
room_collision_enabled =true
enabled_person01 =false
enabled_person02 =true
enabled_person03 =true
enabled_person04 =true
collision_scope =full_body_all
; Translation
translation_horizontal_scale = 0.25
translation_vertical_scale = 0.25
translation_depth_scale = 0.25
; Rotation
rotation_horizontal_scale = -4.0
rotation_vertical_scale = -4.00
rotation_twist_scale = 4.00
; While face-down, choose which mapped translation channel is adjusted. Channel: horizontal, vertical, or depth. Sign: -1 flips, 1 keeps, 0 disables.
face_down_translation_channel = vertical
face_down_translation_sign = -1.0
; Gravity
gravity_horizontal_curve = 2.75
gravity_vertical_curve = 1.0
; Wind
wind_enabled = true
wind_scale = 1.5
; Misc
stiffness = 100.0
damping = 8.0
joint01_max_angle = 180,180,180
joint01_min_angle = -180,-180,-180
joint02_max_angle = 100,100,100
joint02_min_angle = -100,-100,-100
joint03_max_angle = 50,50,50
joint03_min_angle = -50,-50,-50
joint01_gain = 1.5
joint02_gain = 1.5
joint03_gain = 0.85
interval_ms = 16

[testicle_physics]
enabled =true
room_collision_enabled =true
enabled_person01 =true
enabled_person02 =true
enabled_person03 =true
enabled_person04 =true
collision_scope =pelvis_and_genitals_only
; Translation
translation_horizontal_scale = 0.25
translation_vertical_scale = 0.25
translation_depth_scale = 0.25
; Rotation
rotation_horizontal_scale = -4.0
rotation_vertical_scale = -4.00
rotation_twist_scale = 4.00
; While face-down, choose which mapped translation channel is adjusted. Channel: horizontal, vertical, or depth. Sign: -1 flips, 1 keeps, 0 disables.
face_down_translation_channel = vertical
face_down_translation_sign = 1.0
; Gravity
gravity_horizontal_curve = 1.0
gravity_vertical_curve = 1.0
; Wind
wind_enabled = true
wind_scale = 1.0
; Misc
stiffness = 115.0
damping = 4.0
joint01_max_angle = 30,7.5,20
joint01_min_angle = -30,-7.5,-65
joint02_max_angle = 60,60,60
joint02_min_angle = -60,-60,-60
joint01_gain = 1.0
