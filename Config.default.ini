finger02_radius = 0.005,0.005,0.005
finger03_radius = 0.005,0.005,0.005
finger04_radius = 0.005,0.005,0.005
finger05_radius = 0.005,0.005,0.005

; --- Collision response ---
; response_radius_scale: scales all body radii used by collision. Range 0.05-4.0.
; chain_radius: thickness of the colliding chain links. Range 0.001-0.25.
; jointXX_link_length: fallback chain lengths used when live engine pivots are unavailable. Range 0.005-0.5.
; collision_strength: response force; 0 disables correction. Range 0-4.
; collision_max_degrees_per_tick: per-tick rotation safety cap. Range 0.1-45.
; collision_iterations: solver passes per update. Range 1-6.
; collision_slop: permitted overlap used to suppress boundary chatter. Range 0-0.02.
response_radius_scale = 0.75
chain_radius = 0.0275
joint01_link_length = 0.5
joint02_link_length = 0.5
joint03_link_length = 0.5
collision_strength = 2.0
collision_max_degrees_per_tick = 45.0
collision_iterations = 2
collision_slop = 0.0010

; --- Logging ---
; Log intervals are milliseconds and are clamped to 250-30000.
health_log_ms = 2000
response_log_ms = 1000

[collision_auto_test]
; enabled: boolean - Runs one automatic diagnostic pass after the body chain, gravity, and colliders are ready.
; person: string - Person01 to Person04 tested by the automatic runner.
; mode: string - testicles or hip. Hip mode sweeps live hip/knee channels and root-tilted hip capsule poses.
; start_delay_ms: integer - Additional quiet time after the physics systems become ready.
; phase_ms: integer - Time each automatic root/testicle/hip rotation is held.
; rest_ms: integer - Neutral reset time between automatic rotations.
; root_amount: float - Positive/negative root rotation used for each X/Y/Z test.
; testicle_amount: float - Positive/negative Stesticles_joint01 rotation used on each X/Y/Z collision test.
; hip_amount: float - Positive/negative Ship_L/R and Sknee_L/R rotation used by hip mode.
enabled = false
person = Person02
mode = hip
start_delay_ms = 5000
phase_ms = 1600
rest_ms = 900
root_amount = 90.0
testicle_amount = 35.0
hip_amount = 35.0

; enabled: boolean - Runs one deterministic camera-angle diagnostic and restores normal camera pass-through afterward.
; person: string - Person01 to Person04 whose root/TRS matrices and chain response are captured.
; start_delay_ms: integer - Time after the chain becomes ready to load the looping pose before camera control starts.
; hold_ms: integer - Time each baseline/yaw/pitch camera angle is held.
; sample_ms: integer - Matrix and chain-state logging interval during each angle.
; input_drag_ms: integer - Duration of each automated right-mouse camera drag.
; input_yaw_pixels/input_pitch_pixels: integer - Relative mouse pixels used for the yaw/pitch phases.
; auto_focus: boolean - Brings the TK17 game window to foreground before each automated drag.
[camera_contamination_test]
enabled = false
person = Person02
start_delay_ms = 15000
hold_ms = 2500
sample_ms = 100
input_drag_ms = 650
input_yaw_pixels = 420
input_pitch_pixels = 260
auto_focus = true

; enabled: boolean - Enables the one-shot/pulse body probe.
; person: string - PersonXX target for the probe.
; node: string - Node name to probe.
; use_object: boolean - Uses object pointer instead of raw pointer when true.
; offset: offset - Vector offset to write.
; axis: axis - Vector component to pulse.
; amount: float - Pulse amount.
; duration_ms: integer - Pulse duration.
; cycle: boolean - Cycles through known offsets/axes for discovery.
[body_probe]
enabled = false
person = Person02
node = Spenis_joint01
use_object = false
offset = 0x06c
axis = x
amount = 25
duration_ms = 1500
cycle = true

; enabled: boolean - Enables transform-field change scanning.
