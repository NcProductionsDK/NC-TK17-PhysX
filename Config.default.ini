gravity_inverted_strength = 40.0
gravity_inverted_tail_axis = z
gravity_inverted_sign = -1.0
; Whole-chain safety limits. These cap the accumulated rotation of all three
; hierarchical joints without changing ordinary motion below the limit.
chain_total_bend_max = 180.0
chain_total_twist_max = 90.0
; Collision uses two independent calibrated bend axes. Do not map both to the same axis.
collision_horizontal_tail_axis = z
collision_vertical_tail_axis = y
translation_deadzone = 0.001
rotation_deadzone = 0.001
zero_output_rest = true

