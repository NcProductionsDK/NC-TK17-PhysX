; Butt PhysX targets only butt_L_joint01 and butt_R_joint01.
; Both sides share these settings and each runs as a single-bone spring.
; Child bones follow their butt parent and are not simulated separately.
; Collision and constant bone-translation gravity sag are not included yet.
[butt_physics]
enabled =true
room_collision_enabled =true
enabled_person01 =true
enabled_person02 =true
enabled_person03 =true
enabled_person04 = true
collision_scope =pelvis_and_genitals_only_all
; Translation-driven butt rotation
translation_horizontal_scale = 0.1
translation_vertical_scale = -0.05
translation_depth_scale = 0.1
; Translation-driven physical butt-bone movement
bone_translation_enabled = true
bone_translation_space = body
bone_translation_horizontal_scale = -0.7
bone_translation_vertical_scale = -0.2
bone_translation_depth_scale = -0.7
bone_translation_stiffness = 200.0
bone_translation_damping = 6.0
bone_translation_max_offset = 0.05,0.05,0.05
; Rotation-driven butt rotation
rotation_horizontal_scale = -2.0
rotation_vertical_scale = -2.0
rotation_twist_scale = 2.0
gravity_horizontal_curve = 1.0
gravity_vertical_curve = 1.0
; Orientation gravity (rotation only; no constant translation sag)
gravity_strength = 1.0
; Wind
wind_enabled = true
wind_scale = 1.0
; Misc
stiffness = 150.0
damping = 5.0
joint01_max_angle = 30,30,30
joint01_min_angle = -30,-30,-30
joint01_gain = 1.0
interval_ms = 16

[breasts_physics_internal]
; Breast-only engine ownership and local-axis mapping.
root_offset = 0x0e8
output_offset = 0x06c
bone_translation_output_offset = 0x07c
override_animation = true
poseeditor_track_override = true
; spine_joint04 movement axes: Y horizontal, X vertical, Z depth.
; Translation-driven rotational swing
translation_horizontal_source_axis = x
translation_horizontal_tail_axis = y
translation_vertical_source_axis = y
translation_vertical_tail_axis = z
translation_depth_source_axis = z
translation_depth_tail_axis = z
left_translation_sign = 1,-1,1
right_translation_sign = 1,1,1
; Translation-driven bone translation uses the same spine source axes.
bone_translation_horizontal_source_axis = x
bone_translation_horizontal_tail_axis = x
bone_translation_vertical_source_axis = y
bone_translation_vertical_tail_axis = y
bone_translation_depth_source_axis = z
bone_translation_depth_tail_axis = y
left_bone_translation_sign = 1,1,1
right_bone_translation_sign = 1,1,-1
; spine_joint04 rotation axes: Z horizontal bend, Y vertical bend, X twist.
; Rotation-driven rotational swing
rotation_horizontal_source_axis = x
rotation_horizontal_tail_axis = z
rotation_vertical_source_axis = y
rotation_vertical_tail_axis = y
rotation_twist_source_axis = z
rotation_twist_tail_axis = z
left_rotation_sign = 1,1,-1
right_rotation_sign = -1,1,1
; Wind rotation mapping. Source reads the parent-local projected wind X/Y/Z;
; tail selects the breast rotation output axis; a negative scale flips it.
wind_horizontal_source_axis = x
wind_horizontal_tail_axis = z
wind_horizontal_scale = 0.15
wind_vertical_source_axis = y
wind_vertical_tail_axis = y
wind_vertical_scale = 0.15
wind_depth_source_axis = z
wind_depth_tail_axis = x
wind_depth_scale = 0.0
left_wind_sign = 1,1,1
right_wind_sign = 1,-1,-1
; Gravity has independent axes/signs so mirrored breasts fall toward the same
; world-space side instead of merely squeezing together or moving apart.
; Sign channels are horizontal, vertical, inverted.
gravity_horizontal_tail_axis = y
gravity_vertical_tail_axis = z
gravity_inverted_tail_axis = y
gravity_inverted_strength = 10.0
gravity_inverted_sign = -1.0
left_gravity_sign = 1,1,1
right_gravity_sign = 1,-1,1
gravity_inward_outward_tail_axis = z
gravity_inward_outward_sign = 1
translation_deadzone = 0.001
rotation_deadzone = 0.001
zero_output_rest = false

[penis_physics_internal]
; Engine ownership and calibrated mappings. These normally should not be changed.
root_offset = 0x0e8
output_offset = 0x06c
override_animation = true
animation_output_offset = 0x06c
animation_override_offsets = 0x06c,0x074,0x078,0x088,0x098,0x0a8,0x358,0x368
joint01_pose_override = true
joint01_pose_override_offsets = 0x014,0x018,0x024
joint01_transform_lock = true
joint01_transform_lock_offset = 0x078
poseeditor_track_override = true
poseeditor_track_diagnostic = false
; Translation
translation_horizontal_source_axis = x
translation_horizontal_tail_axis = z
translation_vertical_source_axis = y
translation_vertical_tail_axis = z
translation_depth_source_axis = z
translation_depth_tail_axis = y
; Rotation
rotation_horizontal_source_axis = x
rotation_horizontal_tail_axis = y
rotation_vertical_source_axis = x
rotation_vertical_tail_axis = y
rotation_twist_source_axis = z
rotation_twist_tail_axis = z
; Wind rotation mapping. Source reads the parent-local projected wind X/Y/Z;
; tail selects the penis rotation output axis; a negative scale flips it.
wind_horizontal_source_axis = x
wind_horizontal_tail_axis = z
wind_horizontal_scale = 1.0
wind_vertical_source_axis = y
wind_vertical_tail_axis = y
wind_vertical_scale = 1.0
wind_depth_source_axis = z
wind_depth_tail_axis = x
wind_depth_scale = 0.0
