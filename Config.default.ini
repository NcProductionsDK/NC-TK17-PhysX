; enabled: boolean - Enables direct source-node to target-node drive diagnostics.
; person: string - PersonXX target for the probe.
; source_node: string - Node read as the movement source.
; source_offset: offset - Source vector offset.
; source_axis: axis/auto - Source component, or auto for strongest component.
; target_node: string - Node written by the probe.
; target_offset: offset - Target vector offset.
; target_axis: axis - Target component to write.
; scale: float - Source-to-target scale.
; max_amount: float - Clamp for probe writes.
; threshold: float - Source movement threshold.
; interval_ms: integer - Probe update interval. Minimum is 16 ms.
