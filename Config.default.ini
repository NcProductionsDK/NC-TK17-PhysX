[body_colliders]
; --- General controls ---
; enabled: creates body collision shapes for every present person.
; debug_draw: shows the live collision shapes.
; breasts_collision_enabled/butt_collision_enabled/penis_collision_enabled/testicle_collision_enabled: lets each enabled physics system react to body colliders.
; response_enabled is a legacy alias used only when penis_collision_enabled is missing.
; diagnostic: enables detailed collider logging and should normally remain false.
enabled =true
debug_draw =false
breasts_collision_enabled =false
butt_collision_enabled =true
penis_collision_enabled =true
testicle_collision_enabled =true
response_enabled =false
diagnostic = false

